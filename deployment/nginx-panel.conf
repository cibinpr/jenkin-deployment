# ==============================================================================
# MyPanel - Nginx Control Panel Reverse Proxy Configuration
# Port: 8443 (HTTPS) -> 127.0.0.1:8080 (Fastify API)
# ==============================================================================

server {
    listen 8443 ssl;
    http2 on;
    server_name c1panel.duckdns.org _;

    # TLS Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/c1panel.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c1panel.duckdns.org/privkey.pem;

    # SSL Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Maximum upload/payload size
    client_max_body_size 16m;

    # Reverse proxy to Fastify API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # ACME Challenge location
    location /.well-known/acme-challenge/ {
        root /var/lib/mypanel/acme-challenge;
        allow all;
    }
}
